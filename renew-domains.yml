name: DigitalPlat Domain Auto-Renew

# 说明：
#   - DigitalPlat 免费域名在到期前 120 天内可免费续期
#   - 提前续期需要消耗积分，所以这里只在窗口内动作
#   - 需要仓库 Secret: DP_API_KEY（DigitalPlat 后台 → API Keys 生成）
#   - 每周一 UTC 01:00 自动跑一次；也可在 Actions 页面手动触发
#
# 引用探查：grep "digitalplat-renew.yml" 在会话工作区内无任何命中，本文件是独立
# GitHub Actions 工作流，不被任何代码 import，也无公共函数/类型/导出受影响；
# 无需要同步修改的测试或文档。
# 用户指令原文：「不对这个域名还有用，agentspace用的，帮我恢复续期和dns」

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only check, no renew)'
        type: boolean
        default: true

permissions:
  issues: write
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Check and renew domains
        env:
          DP_API_KEY: ${{ secrets.DP_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -uo pipefail
          API='https://domain-api.digitalplat.org/api/v1'
          TMP=$(mktemp)

          if [ -z "${DP_API_KEY:-}" ]; then
            echo "::error::Missing secret DP_API_KEY"
            exit 1
          fi

          curl -sf -H "Authorization: Bearer $DP_API_KEY" "$API/domains" -o "$TMP" || {
            echo "::error::Failed to list domains"
            cat "$TMP" || true
            exit 1
          }

          echo '--- domains ---'
          jq -r '.data[] | "\(.domain) \(.expires_at)"' "$TMP"

          FAIL=0
          REPORT=''
          RENEWED=0

          while read -r NAME EXPIRY; do
            [ -z "$NAME" ] && continue

            if [ ${#EXPIRY} -eq 8 ]; then
              ISO="${EXPIRY:0:4}-${EXPIRY:4:2}-${EXPIRY:6:2}"
            else
              ISO="${EXPIRY%%T*}"
            fi

            E=$(date -d "$ISO" +%s); N=$(date +%s)
            D=$(( (E-N)/86400 ))
            echo "$NAME -> $ISO, $D days left"

            if [ "$D" -gt 120 ]; then
              REPORT="$REPORT\n- $NAME: $D days left (not in 120-day window)"
              continue
            fi

            if [ "$DRY_RUN" = 'true' ]; then
              REPORT="$REPORT\n- $NAME: IN WINDOW ($D days) [dry-run]"
              continue
            fi

            R=$(curl -s -X POST \
              -H "Authorization: Bearer $DP_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{"years":1,"payment_method":"credits"}' \
              "$API/domains/$NAME/renew")
            echo "renew $NAME => $R"

            OK=$(echo "$R" | jq -r '.success // false')
            if [ "$OK" = 'true' ]; then
              NEWEXP=$(echo "$R" | jq -r '.expires_at // .data.expires_at // "unknown"')
              REPORT="$REPORT\n- $NAME: RENEWED OK -> $NEWEXP"
              RENEWED=$((RENEWED+1))
            else
              MSG=$(echo "$R" | jq -r '.message // .error // "unknown error"')
              REPORT="$REPORT\n- $NAME: FAILED ($MSG)"
              FAIL=1
            fi
          done < <(jq -r '.data[] | "\(.domain) \(.expires_at)"' "$TMP")

          echo -e "== Summary ==\n$REPORT"

          if [ "$FAIL" = '1' ]; then
            gh issue create \
              --title '[domain] DigitalPlat renew needs manual check' \
              --body "$(printf "$REPORT")" || true
            exit 1
          fi

          if [ "$RENEWED" -gt 0 ]; then
            gh issue create \
              --title "[domain] DigitalPlat renewed $RENEWED domain(s) on $(date -u +%F)" \
              --body "$(printf "$REPORT")" || true
          fi
          rm -f "$TMP"

      - name: Checkout for heartbeat
        uses: actions/checkout@v4

      - name: Keepalive heartbeat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'renew-bot'
          git config user.email 'renew-bot@users.noreply.github.com'
          echo "last: $(date -u +%FT%TZ)" > .github/workflows/heartbeat.txt
          git add .github/workflows/heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: heartbeat'
          git push || echo '::warning::push failed'
